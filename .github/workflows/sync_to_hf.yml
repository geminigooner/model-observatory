name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]

jobs:
  sync-to-huggingface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://cutiebearr:$HF_TOKEN@huggingface.co/spaces/cutiebearr/model-observatory main
